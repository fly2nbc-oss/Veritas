# Rules for the dependencies, checked in CI with `cargo deny check`.
# Every dependency must carry one of these licenses (or offer it as a choice) and come from
# crates.io. Known security vulnerabilities fail the run.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates only count as errors when Veritas depends on them directly. What egui,
# eframe and trash bring along (e.g. chrono, RUSTSEC-2026-0543) cannot be swapped out here;
# `cargo audit` lists it locally.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
